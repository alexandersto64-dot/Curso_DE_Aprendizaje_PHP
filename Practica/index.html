<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablas de Empleados</title>
</head>
<body>
    <h1>Tablas de Empleados</h1>

    <table border="1">
        <tr>
            <th>ID</th>
            <th>NOMBRE</th>
            <th>CARGO</th>
            <th>EDAD</th>
            <th>SUELDO</th>
            <th>ESTADO</th>
            <th>ACCIONES</th>
        </tr>

        <tr>
            <td>01</td>
            <td>Juan</td>
            <td>Ingenieria</td>
            <td>50</td>
            <td>S/ 1000</td>
            <td>Activo</td>
            <td>Soporte</td>            
        </tr>
        <tr>
            <td>02</td>
            <td>MAria</td>
            <td>Comunicaciones</td>
            <td>30</td>
            <td>S/ 1500</td>
            <td>Inactivo</td>
            <td>Comunicar</td>
        </tr>
        <tr>
            <td colspan="2">Hola</td>
            <td colspan="3">Hola</td>
            <td colspan="2">Hola</td>
        </tr>
        <tr>
            <td rowspan="2">hola mundo</td>            
            <td colspan="4">Hola</td>
            <td rowspan="2" colspan="2">hola mundo</td>                        
        </tr>
        <tr>
            
            <td colspan="4">2</td>
        </tr>
        <tr>
            <td colspan="4">2</td>
            <td rowspan="2">hola mundo</td>
            <td rowspan="2">hola mundo</td>            
            <td rowspan="2">hola mundo</td>            

        </tr>
        <tr>
            <td colspan="4">2</td>
        </tr>
    </table>

    table>tr>th*7>td*7
</body>
</html>
