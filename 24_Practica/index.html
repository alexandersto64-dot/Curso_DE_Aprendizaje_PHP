<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <title>Tabla de Empleados</title>
</head>
<body class="bg-light">

    <div class="container mt-5">

        <h1 class="text-center mb-4">
            <i class="bi bi-people-fill"></i>
            Tabla de Empleados
        </h1>

        <table class="table table-bordered table-hover table-striped text-center align-middle">

            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>NOMBRE</th>
                    <th>CARGO</th>
                    <th>EDAD</th>
                    <th>SUELDO</th>
                    <th>ESTADO</th>
                    <th>ACCIONES</th>
                </tr>
            </thead>

            <tbody>

                <tr>
                    <td>01</td>
                    <td>Juan</td>
                    <td>Ingeniería</td>
                    <td>50</td>
                    <td>S/ 1000</td>
                    <td>
                        <span class="badge bg-success">
                            <i class="bi bi-check-circle-fill"></i>
                            Activo
                        </span>
                    </td>
                    <td>
                        <button class="btn btn-primary btn-sm">
                            <i class="bi bi-headset"></i>
                            Soporte
                        </button>
                    </td>
                </tr>

                <tr>
                    <td>02</td>
                    <td>Maria</td>
                    <td>Comunicaciones</td>
                    <td>30</td>
                    <td>S/ 1500</td>
                    <td>
                        <span class="badge bg-danger">
                            <i class="bi bi-x-circle-fill"></i>
                            Inactivo
                        </span>
                    </td>
                    <td>
                        <button class="btn btn-warning btn-sm">
                            <i class="bi bi-chat-dots-fill"></i>
                            Comunicar
                        </button>
                    </td>
                </tr>

                <!-- FILA COLSPAN -->
                <tr>
                    <td colspan="2" class="table-info">
                        Hola
                    </td>

                    <td colspan="3" class="table-warning">
                        Hola
                    </td>

                    <td colspan="2" class="table-success">
                        Hola
                    </td>
                </tr>

                <!-- FILA ROWSPAN -->
                <tr>
                    <td rowspan="2" class="table-secondary align-middle">
                        hola mundo
                    </td>

                    <td colspan="4" class="table-primary">
                        Hola
                    </td>

                    <td rowspan="2" colspan="2" class="table-danger align-middle">
                        hola mundo
                    </td>
                </tr>

                <tr>
                    <td colspan="4" class="table-light">
                        2
                    </td>
                </tr>

                <!-- OTRO EJEMPLO -->
                <tr>
                    <td colspan="4" class="table-warning">
                        2
                    </td>

                    <td rowspan="2" class="table-info align-middle">
                        hola mundo
                    </td>

                    <td rowspan="2" class="table-info align-middle">
                        hola mundo
                    </td>

                    <td rowspan="2" class="table-info align-middle">
                        hola mundo
                    </td>
                </tr>

                <tr>
                    <td colspan="4" class="table-success">
                        2
                    </td>
                </tr>

            </tbody>

        </table>

    </div>

</body>
</html>
